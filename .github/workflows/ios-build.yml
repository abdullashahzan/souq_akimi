name: iOS unsigned build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile for physical iOS devices without Apple signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (requires personal Apple signing before use)
        run: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          ditto -c -k --keepParent Payload ../Souq-Akimi-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Souq-Akimi-iOS-unsigned
          path: build/ios/Souq-Akimi-iOS-unsigned.ipa
          retention-days: 14
